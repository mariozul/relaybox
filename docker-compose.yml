services:
  postgres:
    image: postgres:16-alpine
    container_name: relaybox-postgres
    environment:
      POSTGRES_USER: relaybox
      POSTGRES_PASSWORD: relaybox
      POSTGRES_DB: relaybox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaybox -d relaybox"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
