name: gate-c-ci
on:
  pull_request:
    branches: [main, develop]
jobs:
  gate-c:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaybox
          POSTGRES_PASSWORD: relaybox
          POSTGRES_DB: relaybox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relaybox -d relaybox"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://relaybox:relaybox@localhost:5432/relaybox?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Build
        run: go build ./...
      - name: Test with coverage
        run: go test -race -timeout 90s -coverprofile=coverage.out ./...
      - name: Enforce coverage >= 85%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { exit (c+0 >= 85) ? 0 : 1 }' \
            || { echo "::error::coverage ${total}% is below 85% threshold"; exit 1; }
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.0
